server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Forward /api/... to the API container, dropping the /api prefix. The address is looked up
  # when a request comes in (not when nginx starts), so nginx still starts if the API is
  # restarting, and picks it up again when it is back.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4m;
  }

  # Built files have a hash in their name, so they can be cached for good.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: any other address is handled by the app's router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
